<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="480" height="480" role="img" aria-label="Muse &amp; Make">
<title>Muse &amp; Make</title>
<style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Nunito:wght@700&display=swap');
.s1,.s2,.s3{stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.s1{animation:show 0s .3s both,draw .38s .3s cubic-bezier(.5,0,.2,1) both,boing .45s .68s cubic-bezier(.3,1.8,.5,1)}
.s2{animation:show 0s .62s both,draw .26s .62s cubic-bezier(.5,0,.2,1) both,boing .45s .88s cubic-bezier(.3,1.8,.5,1)}
.s3{animation:show 0s .84s both,draw .38s .84s cubic-bezier(.5,0,.2,1) both,boing .45s 1.22s cubic-bezier(.3,1.8,.5,1)}
.blob{transform-origin:120px 120px;animation:spinpop .5s cubic-bezier(.3,1.6,.5,1) both}
.thumb{transform-box:fill-box;transform-origin:center;animation:pop .3s .25s cubic-bezier(.3,1.8,.5,1) both}
.dot{transform-box:fill-box;transform-origin:center;animation:drop .38s cubic-bezier(.3,1.9,.5,1) both}
.d0{animation-delay:1.25s}.d1{animation-delay:1.32s}.d2{animation-delay:1.39s}.d3{animation-delay:1.46s}
.sp1,.sp2{transform-box:fill-box;transform-origin:center;opacity:0;animation:twinkle 1.4s 1.5s ease-in-out infinite}
.sp2{animation-delay:1.9s}
.icon{transform-origin:120px 200px;animation:jump .55s 1.55s cubic-bezier(.3,1.5,.5,1),wiggle 2.2s 2.2s ease-in-out infinite}
@keyframes show{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes spinpop{from{transform:scale(0) rotate(-35deg)}to{transform:scale(1) rotate(0)}}
@keyframes boing{0%{transform:none}30%{transform:scale(1.18,.82)}60%{transform:scale(.92,1.12) translateY(-4px)}100%{transform:none}}
@keyframes drop{from{transform:scale(0) translateY(-40px)}to{transform:scale(1) translateY(0)}}
@keyframes jump{0%,100%{transform:none}40%{transform:translateY(-8px) scale(1.04,.97)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}40%,60%{opacity:1;transform:scale(1.15) rotate(90deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
]]></style>
<g class="icon">
  <path class="blob" d="M120 14 C 176 12, 222 50, 226 110 C 230 168, 190 222, 126 226 C 64 230, 16 192, 14 128 C 12 66, 60 16, 120 14 Z" fill="#F6DCD3"/>
  <circle class="thumb" cx="120" cy="196" r="10" fill="#FBF4EA"/>
  <circle class="dot d0" cx="76" cy="64" r="8" fill="#E9806E"/><circle class="dot d1" cx="104" cy="54" r="6.5" fill="#EDB94F"/><circle class="dot d2" cx="136" cy="54" r="7" fill="#97B694"/><circle class="dot d3" cx="164" cy="64" r="5.5" fill="#B7A3D8"/>
  <g transform="translate(66 124) scale(0.4) translate(-137 -113)"><path class="s1" d="M62 168 C 64 128, 70 92, 82 72 C 92 56, 102 74, 108 98 C 113 118, 118 124, 122 108 C 128 84, 136 60, 150 58 C 166 56, 170 100, 172 136 C 173 158, 178 172, 192 168 C 202 165, 208 154, 212 144" stroke="#3D2C3E" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g>
  <g transform="translate(120 126) scale(0.74) translate(-22 -31)"><path class="s2" d="M 36 58 L 13 27 C 5 15, 10 4, 19 4 C 28 4, 31 13, 24 22 L 9 39 C 1 49, 6 59, 17 59 C 27 59, 33 51, 38 41" stroke="#E9806E" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g>
  <g transform="translate(174 124) scale(0.4) translate(-137 -113)"><path class="s3" d="M62 168 C 64 128, 70 92, 82 72 C 92 56, 102 74, 108 98 C 113 118, 118 124, 122 108 C 128 84, 136 60, 150 58 C 166 56, 170 100, 172 136 C 173 158, 178 172, 192 168 C 202 165, 208 154, 212 144" stroke="#3D2C3E" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g>
  <path class="sp1" transform="translate(206 30) scale(1.1)" fill="#EDB94F" d="M0 -10 C 1.5 -3, 3 -1.5, 10 0 C 3 1.5, 1.5 3, 0 10 C -1.5 3, -3 1.5, -10 0 C -3 -1.5, -1.5 -3, 0 -10 Z"/><path class="sp2" transform="translate(30 92) scale(0.7)" fill="#EDB94F" d="M0 -10 C 1.5 -3, 3 -1.5, 10 0 C 3 1.5, 1.5 3, 0 10 C -1.5 3, -3 1.5, -10 0 C -3 -1.5, -1.5 -3, 0 -10 Z"/>
</g>
</svg>
